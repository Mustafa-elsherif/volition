project_name: "volition"
seed: 42

ibl:
  server: "https://openalyx.internationalbrainlab.org"
  public_username: "intbrainlab"     # IBL's shared public account
  public_password: "international"   # published by IBL for public access
  release_freeze: "2023_12_bwm_release"
  aggregate_tag: "2024_Q2_IBL_et_al_BWM"   # IBL tables that match this release

data:
  n_sessions: 10
  window: [-0.1, 0.0]            # seconds, relative to the first wheel movement
  min_reaction_time: 0.08
  max_reaction_time: 2.0
  good_neuron_qc: 1.0
  region_mapping: "Beryl"
  excluded_regions: ["root", "void"]
  min_neurons: 60
  min_trials: 400
  min_errors: 3
  min_regions: 3
  neurons_per_region: 10
  max_sessions_per_lab: 2
  fallback_min_regions: 2        # only if fewer than 10 sessions pass
  fallback_min_neurons: 40       # only if still fewer than 10 sessions

splits:
  n_folds: 5
  inner_folds: 3
  gap_trials: 10
  min_train_for_inner_gap: 100   # smaller training sets use gap 0 inside

models:
  names: ["majority", "logreg", "random_forest", "stimulus_only", "prior_only"]
  logreg_C: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
  default_C: 1.0                 # only when tuning is impossible
  rf_n_trees: 200
  rf_max_depth: 6
  rf_min_samples_leaf: 5
  calibration: ["none", "platt"]

experiments:
  names: ["full", "less_data", "missing_neurons", "missing_region", "random_same_count", "shuffled_labels"]
  n_repeats: 10
  n_random_repeats: 200
  n_shuffles: 1000
  train_fractions: [1.0, 0.5, 0.25, 0.1]
  dropout_rates: [0.0, 0.1, 0.25, 0.5, 0.75, 0.9]
  min_neurons_per_region: 5

evaluation:
  metrics: ["balanced_accuracy", "roc_auc", "f1", "brier", "ece"]
  threshold: 0.5
  n_bins: 10
  n_bootstrap: 10000
  ci_level: 0.95
  alpha: 0.05
  min_group_trials: 10
  control_groups: ["all", "correct", "error", "zero_contrast", "prior_0.2", "prior_0.5", "prior_0.8"]